  <!-- Node 3 -->
  <circle cx="54" cy="110" r="6" fill="#0D9488" stroke="white" stroke-width="2"/>
  <rect x="68" y="98" width="102" height="24" rx="6" fill="white" stroke="#CCFBF1" stroke-width="1.5"/>
  <rect x="76" y="104" width="54" height="4" rx="2" fill="#0D9488"/>
  <rect x="76" y="111" width="42" height="3" rx="1.5" fill="#CBD5E1"/>

  <!-- Connector line 3 -->
  <line x1="54" y1="110" x2="68" y2="110" stroke="#0D9488" stroke-width="1.5"/>
</svg>
