<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <!-- Background -->
  <rect width="200" height="140" rx="12" fill="#F0FDFA"/>

  <!-- Vertical timeline line -->
  <line x1="54" y1="18" x2="54" y2="122" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Node 1 -->
  <circle cx="54" cy="30" r="6" fill="#0D9488" stroke="white" stroke-width="2"/>
  <rect x="68" y="18" width="102" height="24" rx="6" fill="white" stroke="#CCFBF1" stroke-width="1.5"/>
  <rect x="76" y="24" width="48" height="4" rx="2" fill="#0D9488"/>
  <rect x="76" y="31" width="72" height="3" rx="1.5" fill="#CBD5E1"/>

  <!-- Connector line 1 -->
  <line x1="54" y1="30" x2="68" y2="30" stroke="#0D9488" stroke-width="1.5"/>

  <!-- Node 2 -->
  <circle cx="54" cy="70" r="6" fill="#14B8A6" stroke="white" stroke-width="2"/>
  <rect x="68" y="58" width="102" height="24" rx="6" fill="white" stroke="#CCFBF1" stroke-width="1.5"/>
  <rect x="76" y="64" width="36" height="4" rx="2" fill="#14B8A6"/>
  <rect x="76" y="71" width="60" height="3" rx="1.5" fill="#CBD5E1"/>

  <!-- Connector line 2 -->
