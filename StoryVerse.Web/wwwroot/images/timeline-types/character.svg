<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <!-- Background -->
  <rect width="200" height="140" rx="12" fill="#FDF2F8"/>

  <!-- Character avatar circle -->
  <circle cx="60" cy="65" r="36" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>

  <!-- Character head -->
  <circle cx="60" cy="50" r="14" fill="#BE185D" stroke="white" stroke-width="1.5"/>

  <!-- Character body -->
  <path d="M36 90 C36 78, 84 78, 84 90" fill="#BE185D"/>

  <!-- Horizontal timeline line -->
  <line x1="96" y1="65" x2="178" y2="65" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Event dots on timeline -->
  <circle cx="112" cy="65" r="6" fill="#0D9488" stroke="white" stroke-width="2"/>
  <circle cx="136" cy="65" r="6" fill="#0D9488" stroke="white" stroke-width="2"/>
  <circle cx="160" cy="65" r="6" fill="#14B8A6" stroke="white" stroke-width="2"/>

  <!-- Event labels above -->
  <rect x="99" y="50" width="26" height="4" rx="2" fill="#CCFBF1"/>
  <rect x="123" y="50" width="26" height="4" rx="2" fill="#CCFBF1"/>
  <rect x="147" y="50" width="26" height="4" rx="2" fill="#CCFBF1"/>

  <!-- Event labels below -->
  <rect x="99" y="76" width="26" height="4" rx="2" fill="#CCFBF1"/>
  <rect x="123" y="76" width="26" height="4" rx="2" fill="#CCFBF1"/>
  <rect x="147" y="76" width="26" height="4" rx="2" fill="#CCFBF1"/>
</svg>
